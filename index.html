<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" />

  <title>可云</title>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <script src="./env.js"></script>

  <script type="module" crossorigin src="/assets/umi.js"></script>

  <link rel="stylesheet" href="/assets/plan.css">

  <style>
    :root { --login-bg: url('/assets/login-bg.jpg'); }
    .notice-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 999999; }
    .notice-box { width: 82%; max-width: 380px; background: #fff; padding: 20px; border-radius: 18px; text-align: center; animation: ky-popup .3s ease; box-shadow: 0 12px 35px rgba(0,0,0,0.16); }
    .notice-close { font-size: 22px; cursor: pointer; text-align: right; margin-bottom: 8px; }
    @keyframes ky-popup { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    function togglePlan(elem) {
      const content = elem.previousElementSibling;
      if (content.style.maxHeight) {
        content.style.maxHeight = null;
        elem.innerText = "展开详情";
        content.classList.remove("open");
      } else {
        content.style.maxHeight = content.scrollHeight + "px";
        elem.innerText = "收起详情";
        content.classList.add("open");
      }
    }
  </script>

  <script>
  (function () {
      function injectPlanCard() {
        const hash = location.hash.replace('#', '');
        if (hash.startsWith('/plan')) {
          const container = document.querySelector('.ant-pro-page-container-children-container') || document.querySelector('.ant-pro-children-content');
          if (!container) return setTimeout(injectPlanCard, 300);
          if (document.getElementById('ky-plan-card')) return;
          const html = `
            <div id="ky-plan-card" class="plan-card">
              <div class="plan-title">Premium 套餐</div>
              <div class="plan-subtitle">高速 / 套餐说明 / GPT 优化</div>
              <div class="plan-content">
                <p>- 解锁流媒体（Netflix / Disney+）</p>
                <p>- GPT 专线，低延迟高稳定</p>
                <p>- 不限速、不限设备数（合理使用）</p>
                <p>- 含 HK / JP / TW / US 节点池</p>
              </div>
              <div class="plan-toggle" onclick="togglePlan(this)">展开详情</div>
            </div>`;
          container.insertAdjacentHTML('afterbegin', html);
        }
        setTimeout(injectPlanCard, 500);
      }
      injectPlanCard();
  })();
  </script>

  <script>
  (function () {
    const DASHBOARD_PATH = "/dashboard";
    let popupInitialized = false;
    function createNoticePopup(onClose) {
      const mask = document.createElement("div");
      mask.className = "notice-mask";
      mask.innerHTML = `
        <div class="notice-box">
          <div class="notice-close" id="noticeClose">×</div>
          <h2>📢 新人必看公告</h2>
          <p style="line-height:1.6;">欢迎来到可云，请务必阅读顶部公告栏信息。</p>
          <p style="line-height:1.6;">请收藏最新地址：<b>shy521.com</b></p>
          <p style="line-height:1.6;margin-bottom:18px;">加入 TG 群组：<a href="https://t.me/ss_keyun" target="_blank">t.me/ss_keyun</a></p>
        </div>`;
      document.body.appendChild(mask);
      mask.querySelector("#noticeClose").onclick = () => {
        mask.remove();
        if (typeof onClose === "function") onClose();
      };
    }
    setInterval(() => {
      if (!popupInitialized && location.hash.replace("#", "").startsWith(DASHBOARD_PATH)) {
        popupInitialized = true;
        setTimeout(() => createNoticePopup(), 1500);
      }
    }, 300);
  })();
  </script>
</body>
</html>
